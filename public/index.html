<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Skyline — le jeu des quartiers</title>
  <meta name="description" content="Achète des quartiers, construis, échange et ruine tes amis. Multijoueur en temps réel sur mobile." />
  <meta name="theme-color" content="#0b0b1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Skyline" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="bg"><i></i><i></i><i></i></div>

  <!-- Accueil -->
  <section id="home" class="screen">
    <div class="hero">
      <div class="logo"><span>SKY</span>LINE</div>
      <p class="tagline">Achète. Construis. Négocie.<br/>Ruine tes amis avec style.</p>
    </div>
    <div class="card glass">
      <label class="lbl">Ton pseudo</label>
      <input id="name" maxlength="16" placeholder="ex. Camille" autocomplete="nickname" />
      <label class="lbl">Ton pion</label>
      <div id="tokenPick" class="token-pick"></div>
      <button id="btnCreate" class="btn primary big">✨ Créer une partie</button>
      <div class="sep"><span>ou rejoindre</span></div>
      <div class="row">
        <input id="code" maxlength="5" placeholder="CODE" class="code-input" autocapitalize="characters" autocomplete="off" />
        <button id="btnJoin" class="btn">Rejoindre</button>
      </div>
    </div>
    <p class="hint" id="installHint"></p>
  </section>

  <!-- Salon -->
  <section id="lobby" class="screen hidden">
    <div class="topbar">
      <button class="icon-btn" id="btnLeaveLobby" aria-label="Quitter">←</button>
      <div class="muted">Salon</div>
      <div style="width:40px"></div>
    </div>
    <div class="card glass center">
      <div class="muted small">Code de la partie</div>
      <div class="room-code" id="roomCode">----</div>
      <button class="btn primary" id="btnShare">📲 Inviter des amis</button>
      
    </div>
    <div class="card glass">
      <div class="lbl">Joueurs <span id="playerCount" class="muted"></span></div>
      <ul id="lobbyPlayers" class="lobby-players"></ul>
      <label class="lbl">Ton pion</label>
      <div id="tokenPickLobby" class="token-pick"></div>
    </div>
    <button class="btn primary big" id="btnStart">🎲 Lancer la partie</button>
    <p class="hint" id="lobbyHint"></p>
  </section>

  <!-- Jeu -->
  <section id="game" class="screen hidden">
    <div id="players" class="players"></div>
    <div class="board-wrap">
      <div id="board" class="board">
        <div class="center" id="center">
          <div class="center-logo"><span>SKY</span>LINE</div>
          <div class="dice" id="dice"><div class="die"></div><div class="die"></div></div>
          <div class="center-msg" id="centerMsg"></div>
        </div>
      </div>
      <div id="reactions" class="reactions-layer"></div>
    </div>
    <div class="panel glass" id="panel">
      <div class="status" id="status"></div>
      <div class="actions" id="actions"></div>
      <div class="feed" id="feed"></div>
      <div class="tabs">
        <button data-tab="assets">🏘️ Mes biens</button>
        <button data-tab="trade">🤝 Échanger</button>
        <button data-tab="log">📜 Journal</button>
        <button data-tab="react">😄</button>
      </div>
    </div>
  </section>

  <!-- Feuille modale -->
  <div id="sheet" class="sheet hidden">
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-body glass">
      <div class="sheet-grip" data-close></div>
      <button class="sheet-x" data-close aria-label="Fermer">✕</button>
      <div id="sheetContent"></div>
    </div>
  </div>

  <div id="toasts" class="toasts"></div>
  <div id="conn" class="conn hidden">Reconnexion…</div>

  <script src="./app.js" type="module"></script>
</body>
</html>
