# Déploiement sur Fly.io : `fly launch --copy-config` puis `fly deploy`
app = "skyline-game"
primary_region = "cdg"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "connections"
    soft_limit = 500

[[http_service.checks]]
  path = "/healthz"
  interval = "30s"
  timeout = "3s"
